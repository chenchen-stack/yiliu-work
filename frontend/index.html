<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>亿流 Work 中台</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      ;(function () {
        var path = location.pathname.replace(/\/$/, '') || '/'
        if (path.endsWith('/yiliu-work') && !location.pathname.includes('/login')) {
          location.replace(path + '/login' + location.search + location.hash)
        }
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
